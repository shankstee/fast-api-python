<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ember</title>
<style>
  html,body{margin:0;height:100%;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{width:min(100vw,177.78vh);aspect-ratio:16/9;display:block;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// EMBER — a wordless short film. Everything (picture and sound) is generated in this file.
const cv=document.getElementById('c'),x=cv.getContext('2d'),W=1280,H=720,D=Math.min(2,window.devicePixelRatio||1);
cv.width=W*D;cv.height=H*D;
const PI=Math.PI,TAU=PI*2,sin=Math.sin,cos=Math.cos;
const cl=(v,a=0,b=1)=>v<a?a:v>b?b:v,lerp=(a,b,k)=>a+(b-a)*k,sm=p=>{p=cl(p);return p*p*(3-2*p)};
const seg=(v,a,b)=>cl((v-a)/(b-a)),ss=(v,a,b)=>sm(seg(v,a,b)),pulse=(v,a,b,f=.4)=>Math.min(ss(v,a,a+f),1-ss(v,b-f,b));
const hash=n=>{const v=sin(n*127.1+3.7)*43758.5453;return v-Math.floor(v)};
const mixA=(a,b,k)=>a.map((v,i)=>lerp(v,b[i],cl(k))),rgb=a=>`rgb(${a.map(v=>v|0)})`,rgba=(a,al)=>`rgba(${a.map(v=>v|0)},${al})`;
const CREAM=[246,228,198],ASH=[100,108,124],INK='#10121a',WARM=[255,184,84],DARK='#090b11';
// sky palettes [top],[bottom]: predawn, rain-night, sick day, dawn, sunrise, alarm
const NT=[22,30,58],NB=[72,90,126],RT=[9,12,21],RB=[30,38,56],DYT=[116,124,134],DYB=[192,182,158],DT=[46,62,116],DB=[246,150,98],ST=[60,86,152],SB=[255,202,128],RDT=[44,5,9],RDB=[150,28,20];
let cam={x:0,y:0,z:1},T=0,au={},fadeK=0,flash=0;

// ---------- drawing kit ----------
function world(){x.setTransform(D*cam.z,0,0,D*cam.z,D*(W/2-cam.x*cam.z),D*(H/2-cam.y*cam.z))}
function screen(){x.setTransform(D,0,0,D,0,0)}
function glow(gx,gy,r,a,c=WARM){if(a<=0||r<=0)return;const g=x.createRadialGradient(gx,gy,0,gx,gy,r);g.addColorStop(0,rgba(c,Math.min(1,a)));g.addColorStop(1,rgba(c,0));
  x.globalCompositeOperation='lighter';x.fillStyle=g;x.beginPath();x.arc(gx,gy,r,0,TAU);x.fill();x.globalCompositeOperation='source-over'}
function spark(sx,sy,r,a=1){if(a<=0||r<=0)return;glow(sx,sy,r*8,.5*a);glow(sx,sy,r*3,.9*a,[255,236,190]);x.fillStyle=rgba([255,250,232],a);x.beginPath();x.arc(sx,sy,r*(1+.18*sin(T*23)),0,TAU);x.fill()}
function sky(top,bot){screen();const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,rgb(top));g.addColorStop(1,rgb(bot));x.fillStyle=g;x.fillRect(0,0,W,H)}
function stars(a){if(a<=0)return;screen();for(let i=0;i<80;i++){x.fillStyle=`rgba(230,236,255,${a*(.3+.7*hash(i+.2))*(.7+.3*sin(T*2+i))})`;x.fillRect(hash(i)*W,hash(i+.5)*H*.62,2,2)}}
function hills(d,amp,col,sd){screen();const gy=H/2-cam.y*cam.z,k=cam.z*lerp(.6,1,d);if(gy-amp*2*k>H)return;x.fillStyle=col;x.beginPath();x.moveTo(0,H);
  for(let i=0;i<=W;i+=16){const wx=(i-W/2)/k+cam.x*d;x.lineTo(i,gy-amp*k*(1+.6*sin(wx*.0031+sd)+.4*sin(wx*.0083+sd*2.3)))}x.lineTo(W,H);x.fill()}
function land(bot){hills(.2,70,rgb(mixA(bot,[8,10,16],.55)),1);hills(.5,36,rgb(mixA(bot,[8,10,16],.75)),4);world();x.fillStyle=rgb(mixA(bot,[6,8,12],.9));x.fillRect(-9e3,0,18e3,4e3)}
function scn(t,b,st){sky(t,b);stars(st);land(b)}
function rain(a){if(a<=0)return;screen();x.strokeStyle=`rgba(165,185,220,${.32*a})`;x.lineWidth=1.3;x.beginPath();
  for(let i=0;i<150;i++){const yy=(hash(i+9)*800+T*(950+hash(i)*500))%800-40,xx=((hash(i+4)*1500-yy*.25)%1400+1400)%1400-60;x.moveTo(xx,yy);x.lineTo(xx-7,yy+28)}x.stroke()}
function fire(fx,fy,k){const cs=['#e2562a','#f08a2c','#ffc04a','#fff0b0'];for(let i=0;i<4;i++){const h=(28+10*sin(T*9+i*2.1))*k*(1-i*.17),wd=(10-i*1.7)*k;x.fillStyle=cs[i];x.beginPath();x.moveTo(fx-wd,fy);
  x.quadraticCurveTo(fx-wd*1.2,fy-h*.5,fx+sin(T*7+i)*3,fy-h);x.quadraticCurveTo(fx+wd*1.2,fy-h*.5,fx+wd,fy);x.fill()}glow(fx,fy-10,150*k,.5);glow(fx,fy-10,330*k,.16)}

// the little one. p.y = feet. returns world positions of hands and chest.
function guy(p){
  const s=p.s||1,dir=p.dir||1,e=p.e??1,c=p.c||0,lean=p.lean||0,wa=p.wa||0,w=p.w||0,py=p.y+(p.hop||0);
  const legH=16*(1-.8*c),by=-legH-25,cs=cos(lean),sn=sin(lean);
  const col=p.col||mixA(ASH,CREAM,e*1.3),body=rgb(col),limb=rgb(col.map(v=>v*.8)),limb2=rgb(col.map(v=>v*.66));
  const toW=(lx,ly)=>{const yy=ly+legH;return[p.x+dir*s*(lx*cs-yy*sn),py+s*(lx*sn+yy*cs-legH)]};
  const shx=3,shy=by-7,hf=p.af||[9,25],hb=p.ab||[-3,25],chest=toW(2,by+12),gl=(p.glow??1)*e;
  if(gl>.01){const a=cl(gl*2);glow(chest[0],chest[1],s*(24+90*gl),.5*a);x.save();x.translate(p.x,p.y);x.scale(1,.13);glow(0,0,s*(40+110*gl),.3*a);x.restore()}
  x.save();x.translate(p.x,py);x.scale(dir*s,s);x.lineCap='round';
  for(const k of[-1,1]){const ph=w+(k<0?PI:0),fx=k*6+sin(ph)*9*wa-12*c,fy=-Math.max(0,cos(ph))*5*wa-2.5;x.strokeStyle=x.fillStyle=k<0?limb2:limb;x.lineWidth=7;
    x.beginPath();x.moveTo(k*5,-legH-2);x.lineTo(fx,fy);x.stroke();x.beginPath();x.ellipse(fx+3,fy,6,3.2,0,0,TAU);x.fill()}
  x.translate(0,-legH);x.rotate(lean);x.translate(0,legH);
  const arm=(h,cc,side)=>{const hx=shx+h[0],hy=shy+h[1],up=seg(hy,by+5,by-20),ox=side*lerp(side>0?9:5,side>0?17:16,up),oy=lerp(by+9,by-4,up);x.strokeStyle=x.fillStyle=cc;x.lineWidth=6;x.beginPath();x.moveTo(ox,oy);
    x.quadraticCurveTo((ox+hx)/2-(hy-oy)*.12,(oy+hy)/2+Math.abs(hx-ox)*.2+2,hx,hy);x.stroke();x.beginPath();x.arc(hx,hy,4.6,0,TAU);x.fill()};
  arm(hb,limb2,-1);
  x.fillStyle=body;x.strokeStyle=INK;x.lineWidth=2.2;x.beginPath();x.ellipse(0,by,20,27,0,0,TAU);x.fill();x.stroke();
  if(p.sp!=null){const q=cl(p.sp,0,1.35),tx=lerp(-11,1,q)+sin(T*3)*1.2*q,ty=by-27-lerp(1,14,q);x.strokeStyle=x.fillStyle=rgb(mixA([92,100,104],[136,214,118],q*cl(e*1.5+.15)));
    x.lineWidth=2.6;x.beginPath();x.moveTo(1,by-26);x.quadraticCurveTo(1,by-34,tx,ty);x.stroke();for(const k of[-1,1]){x.beginPath();x.ellipse(tx+k*5,ty-2,6,3,-k*.5,0,TAU);x.fill()}}
  const lk=p.look||[.4,0],op=p.open??1,lid=p.lid||0,joy=p.joy||0,ew=rgb(mixA([176,182,196],[255,255,255],e*1.5+.2));
  [[-3,6.8,8.4,1],[9.5,7.6,9,-1]].forEach(([ex,rx,ry,inner])=>{const ey=by-9;x.save();x.beginPath();x.ellipse(ex,ey,rx,ry,0,0,TAU);x.fillStyle=ew;x.fill();x.clip();
    const qx=ex+lk[0]*rx*.42,qy=ey+lk[1]*ry*.4;x.fillStyle=INK;x.beginPath();x.arc(qx,qy,rx*.56,0,TAU);x.fill();
    if(p.refl){x.fillStyle=rgba([255,196,100],cl(p.refl));x.beginPath();x.arc(qx+rx*.16,qy+ry*.14,rx*.24*Math.min(1.6,p.refl)*(1+.15*sin(T*19)),0,TAU);x.fill()}
    x.fillStyle='#fff';x.beginPath();x.arc(qx-rx*.2,qy-ry*.22,rx*.13,0,TAU);x.fill();
    const ly=ey-ry+(1-op)*2*ry,si=lid*ry*.75,so=-lid*ry*.25,yr=ly+(inner>0?si:so),yl=ly+(inner>0?so:si);
    x.fillStyle=body;x.beginPath();x.moveTo(ex-rx-1,ey-ry-3);x.lineTo(ex+rx+1,ey-ry-3);x.lineTo(ex+rx+1,yr);x.lineTo(ex-rx-1,yl);x.fill();
    x.strokeStyle=INK;x.lineWidth=1.5;x.beginPath();x.moveTo(ex-rx-1,yl);x.lineTo(ex+rx+1,yr);x.stroke();
    if(joy>0){x.fillStyle=body;x.beginPath();x.ellipse(ex,ey+ry*(2.1-joy*.95),rx*1.5,ry*1.2,0,0,TAU);x.fill()}
    x.restore();x.strokeStyle=INK;x.lineWidth=1.8;x.beginPath();x.ellipse(ex,ey,rx,ry,0,0,TAU);x.stroke()});
  const m=p.m||0;if(Math.abs(m)>.15){x.strokeStyle=INK;x.lineWidth=1.8;x.beginPath();if(m>0)x.arc(3.5,by+3,5*Math.min(1,m),.15*PI,.85*PI);else x.arc(3.5,by+11,5*Math.min(1,-m),1.15*PI,1.85*PI);x.stroke()}
  if(joy>0){x.fillStyle=`rgba(255,120,96,${.3*joy})`;for(const bx of[-9,16]){x.beginPath();x.ellipse(bx,by+3,4.5,2.6,0,0,TAU);x.fill()}}
  if(gl>.01){x.fillStyle=rgba([255,240,205],cl(gl*3));x.beginPath();x.arc(2,by+12,1.5+4.5*cl(gl),0,TAU);x.fill()}
  arm(hf,limb,1);x.restore();
  return{hand:toW(shx+hf[0],shy+hf[1]),handB:toW(shx+hb[0],shy+hb[1]),chest}}

// the tower: honeycomb windows that only ever burn with borrowed light, one eye, a crown.
const TX=1000;
function tower(Ht,o={}){const lit=o.lit||0,red=o.red||0,bw=170,tw=115,wc=mixA([255,198,84],[255,56,40],red);
  x.fillStyle=DARK;x.beginPath();x.moveTo(TX-bw,0);x.lineTo(TX-tw,-Ht);x.lineTo(TX+tw,-Ht);x.lineTo(TX+bw,0);x.fill();
  x.strokeStyle='rgba(130,150,195,.3)';x.lineWidth=2;x.beginPath();x.moveTo(TX-bw,0);x.lineTo(TX-tw,-Ht);x.stroke();
  const rows=Math.floor((Ht-250)/46);
  for(let r=0;r<rows;r++){const y=-50-r*46,hw=lerp(bw,tw,-y/Ht)-20;for(let q=-4;q<=4;q++){const wx=q*40+(r%2?20:0);if(Math.abs(wx)>hw)continue;
    const h=hash(r*7.3+q*3.1),on=h*.5+r/72<lit||(o.first&&r==2&&q==-1);x.fillStyle=on?rgba(wc,.6+.4*sin(T*4+h*40)):'#131724';
    x.beginPath();for(let a=0;a<6;a++)x.lineTo(TX+wx+12*cos(a*PI/3+PI/6),y+12*sin(a*PI/3+PI/6));x.fill()}}
  if(lit>0)glow(TX,-Ht*.35,560,.1*lit,wc);
  const eo=o.eye||0,lk=o.look||[0,0];x.save();x.translate(TX,-Ht+120);
  if(eo<.03){x.strokeStyle='#3a4258';x.lineWidth=3;x.beginPath();x.moveTo(-70,0);x.quadraticCurveTo(0,10,70,0);x.stroke()}
  else{glow(0,0,170,.4*eo,mixA([255,210,130],[255,40,30],red));const alm=()=>{x.beginPath();x.moveTo(-78,0);x.quadraticCurveTo(0,-62*eo,78,0);x.quadraticCurveTo(0,62*eo,-78,0)};
    alm();x.fillStyle=rgb(mixA([255,238,200],[255,214,200],red));x.fill();x.save();x.clip();const ix=lk[0]*30,iy=lk[1]*14;
    x.fillStyle=rgb(mixA([226,150,40],[210,20,20],red));x.beginPath();x.arc(ix,iy,27,0,TAU);x.fill();x.fillStyle='#0a0508';x.beginPath();x.ellipse(ix,iy,7-3*red,24,0,0,TAU);x.fill();x.restore();
    alm();x.strokeStyle=DARK;x.lineWidth=5;x.stroke()}
  x.restore();
  const cr=o.crown??1;x.save();x.translate(TX+(o.cdx||0),-Ht+(o.cdy||0));x.rotate(o.tilt||0);x.scale(cr,cr);x.fillStyle=rgb(mixA([70,60,44],[230,176,60],lit*1.2+.25));
  x.beginPath();[[-72,2],[-80,-50],[-44,-22],[-22,-58],[0,-24],[22,-58],[44,-22],[80,-50],[72,2]].forEach(q=>x.lineTo(q[0],q[1]));x.fill();x.restore()}
function beam(Ht,tx,ty,a){if(a<=0)return;const ex=TX,ey=-Ht+120,g=x.createLinearGradient(ex,ey,tx,ty);g.addColorStop(0,`rgba(255,214,140,${.5*a})`);g.addColorStop(1,`rgba(255,214,140,${.16*a})`);
  x.globalCompositeOperation='lighter';x.fillStyle=g;x.beginPath();x.moveTo(ex-12,ey);x.lineTo(tx-130,ty+6);x.lineTo(tx+130,ty+6);x.lineTo(ex+12,ey);x.fill();x.globalCompositeOperation='source-over';
  x.save();x.translate(tx,ty);x.scale(1,.14);glow(0,0,170,.5*a);x.restore()}
// the hand that comes out of the tower. palm up = "more". spread+curl = claw.
function hand(hx,hy,o={}){const a=o.a??1;if(a<=0)return;const sc=o.s||1.7,curl=o.curl||0,spd=o.spread||0,al=Math.max(30,(TX-hx)/sc);
  x.save();x.globalAlpha=a;x.translate(hx,hy);x.scale(sc,sc);x.lineCap=x.lineJoin='round';x.strokeStyle=x.fillStyle=DARK;
  x.lineWidth=26;x.beginPath();x.moveTo(10,4);x.lineTo(al,4);x.stroke();x.beginPath();x.ellipse(0,2,26,15,0,0,TAU);x.fill();
  for(let i=0;i<4;i++){const a1=PI+.12+curl*.9+(i-1.5)*spd*.32,a2=a1+.35+curl*1.3,bx=-18,by=-3+i*2,mx=bx+cos(a1)*24,my=by+sin(a1)*24;x.lineWidth=11-i;
    x.beginPath();x.moveTo(bx,by);x.lineTo(mx,my);x.lineTo(mx+cos(a2)*20,my+sin(a2)*20);x.stroke()}
  x.lineWidth=11;x.beginPath();x.moveTo(8,-6);x.lineTo(2-curl*14,-27);x.stroke();
  x.strokeStyle='rgba(140,160,200,.35)';x.lineWidth=1.4;x.beginPath();x.moveTo(24,-9);x.lineTo(al,-9);x.stroke();x.restore()}
// stairs that grow with the tower; landing from x=660 to the wall.
function stairs(S){if(S<=1)return;const n=Math.ceil(S/30);x.fillStyle='#0d1018';x.beginPath();x.moveTo(TX-110,0);x.lineTo(TX-110,-S);
  for(let k=0;k<n;k++){const sx=660-k*40,y=Math.min(0,-S+k*30);x.lineTo(sx,y);x.lineTo(sx,Math.min(0,y+30))}x.lineTo(660-n*40,0);x.fill();
  x.strokeStyle='rgba(130,150,190,.22)';x.lineWidth=1.5;x.beginPath();for(let k=0;k<n;k++){const y=-S+k*30;if(y>0)break;x.moveTo(660-k*40,y);x.lineTo(k?700-k*40:TX-110,y)}x.stroke()}
const pathY=(px,S)=>{if(S<=1)return 0;if(px>=660)return-S;const k=(660-px)/40,kf=Math.floor(k);return Math.min(0,-S+(kf+sm(seg(k-kf,0,.35)))*30)};
// the endless line: in step, heads down, each handing its light up to the hand, round and round.
function drones(ph,S,o){const L=1600;let ck=0;for(let i=16;i>=0;i--){const px=-700+(ph+i*94)%L,py=pathY(px,S),h=!i&&o.hero,dp=seg(px,715,770);
  const g=guy(h?{x:px,y:py,w:px*.14,wa:1,lean:.08,...o.hero}:{x:px,y:py,e:o.e,w:o.w,wa:1,lean:.26,look:[.3,.9],open:.5});
  if(o.hand&&dp>0&&dp<1){const k=sm(dp);spark(lerp(g.chest[0],o.hand[0]-16,k),lerp(g.chest[1],o.hand[1]-14,k),2.5);ck=Math.max(ck,sin(dp*PI))}}return ck}
function orb(an){screen();const ox=W*.42,oy=H*.95,R=540,sx=ox-cos(an)*R,sy=oy-sin(an)*R;glow(sx,sy,150,.5,[255,226,170]);x.fillStyle='#ffeec4';x.beginPath();x.arc(sx,sy,30,0,TAU);x.fill();
  x.fillStyle='#c9d3e8';x.beginPath();x.arc(ox+cos(an)*R,oy+sin(an)*R,22,0,TAU);x.fill()}
function tree(tx,ty,g,sc=1){if(g<=0)return;x.lineCap='round';const br=(x1,y1,a,len,d)=>{const gg=cl(g*7.5-d*.95);if(gg<=0||d>6)return;
    const l=len*sm(gg),a2=a+sin(T*1.3+d)*.012*d,x2=x1+cos(a2)*l,y2=y1+sin(a2)*l;x.strokeStyle='#17110f';x.lineWidth=Math.max(1.3,(6.6-d)*1.7*sc*(.35+.65*g));
    x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();const r=hash(d*13.7+a*5.1);
    br(x2,y2,a-.34-.28*r,len*.76,d+1);br(x2,y2,a+.3+.3*hash(r*9.1),len*.73,d+1);
    if(d>=2||g*7.5-(d+1)*.95<=0){const lr=(3+3.5*hash(a*3.3))*sc*sm(gg);glow(x2,y2,lr*3.2,.35*gg,[255,224,130]);x.fillStyle=rgba(mixA([150,214,110],[255,226,120],hash(a*7.7)),.92);x.beginPath();x.arc(x2,y2,lr,0,TAU);x.fill()}};
  br(tx,ty,-PI/2,78*sc,0)}
const jolt=(u,ts)=>ts.reduce((s,t0)=>s+ss(u,t0,t0+.7),0)/ts.length;
const shk=(u,ts,amp)=>{let s=0;for(const t0 of ts){const d=u-t0;if(d>0&&d<1)s=Math.max(s,1-d)}const n=Math.floor(T*45);return[(hash(n)-.5)*amp*s,(hash(n+9)-.5)*amp*s]};

// ---------- the film: a list of shots [seconds, draw(u = seconds into shot, p = 0..1)] ----------
const SH=[],KX=700;
// 1. someone small, full of light, walking through a cold world
SH.push([7,u=>{const gx=lerp(-340,0,ss(u,0,6.3)),lk=ss(u,6.1,6.7);cam={x:gx+90,y:-112,z:1.55};scn(NT,NB,.9);
  guy({x:gx,y:0,sp:1,w:gx*.14,wa:1-lk,look:[.6,-.85*lk],m:.35});fadeK=1-ss(u,0,2.5)}]);
// 2. the tower
SH.push([5,u=>{const k=ss(u,.5,4.4);cam={x:lerp(90,800,k),y:lerp(-112,-420,k),z:lerp(1.55,.72,k)};scn(NT,NB,.9);tower(760);
  guy({x:0,y:0,sp:1,look:[.6,-.85]});au.dr=.05+.1*k;au.cut=220+200*k}]);
// 3. a gift: a piece of their own light
SH.push([6,u=>{cam={x:20,y:-56,z:3};scn(NT,NB,.9);const a=ss(u,1,1.9),b=ss(u,2.3,3.7),rl=Math.max(0,u-4.4);
  const g=guy({x:0,y:0,e:1-.12*b,sp:1,af:[lerp(4,6,a)+4*b,lerp(lerp(25,12,a),-38,b)],ab:[lerp(-3,0,b),lerp(25,-36,b)],look:[.4,lerp(lerp(-.85,.9,a),-.9,b)],m:.3+.5*b,joy:.25*b});
  if(u>2.1)spark(g.hand[0]+1+8*rl,g.hand[1]-6-25*rl-90*rl*rl,3.4*ss(u,2.1,2.8))}]);
// 4. a window lights. the eye opens. they are seen.
SH.push([8,u=>{cam={x:540,y:-360,z:.82};const eo=ss(u,3.6,5.6),bm=ss(u,5.3,6.3),k=seg(u,0,3);scn(NT,NB,.9);
  tower(760,{first:u>3,eye:eo,look:[-.9*ss(u,4.2,5.4),.85*ss(u,4.2,5.4)]});beam(760,0,0,bm);
  guy({x:0,y:0,hop:-Math.abs(sin((u-5.3)*5.5))*9*bm*(1-seg(u,5.3,8)*.7),e:.88+.3*bm,sp:1,af:[lerp(5,8,bm),lerp(8,-34,bm)],ab:[-2,lerp(25,-34,bm)],look:[.6,-.85],m:bm,joy:.5*bm});
  if(k<1)spark(lerp(10,TX-40,sm(k)),lerp(-100,-142,k)-sin(k*PI)*260,3.4);if(u>3&&u<3.8)glow(TX-40,-142,90+260*(u-3),.7*(1-seg(u,3,3.8)));

function thump(v){const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.frequency.setValueAtTime(90,n);o.frequency.exponentialRampToValueAtTime(38,n+.18);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+.3);o.connect(g);g.connect(mg);o.start(n);o.stop(n+.32)}
function boom(v=.5,dur=1.4,f=140){const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain(),n=AC.currentTime;s.buffer=nbuf;fl.type='lowpass';fl.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+dur);s.connect(fl);fl.connect(g);g.connect(mg);s.start(n);s.stop(n+dur)}
const EV=[[16.4,()=>chime(880)],[21,()=>{chime(1318);chime(659)}],[32.9,()=>chime(880)],[34.6,()=>chime(988)],[36.4,()=>chime(1108)],
  ...[41,42.3,43.6,56.2,58.8,61.4,64].map(t=>[t,()=>boom()]),[72.6,()=>chime(659,.06)],[91.6,()=>boom(.7,2.2,300)],
  [100.5,()=>{boom(.8,1.6,400);chime(110,.2,1.2,'sawtooth')}],[102.5,()=>{boom(.9,2.5,900);[523,659,784,1047].forEach(f=>chime(f,.1,3))}],
  ...[523,587,659,784,880,1047,1175,1319].map((f,i)=>[109+i*85/75,()=>chime(f,.1,2.5)]),
  [123.7,()=>chime(784,.1,2)],...[523,659,784,1047,1319].map((f,i)=>[125+i*1.1,()=>chime(f,.08,3)])].sort((a,b)=>a[0]-b[0]);
const seekEv=()=>{evi=EV.findIndex(v=>v[0]>=T);if(evi<0)evi=EV.length;nextBeat=T};
function audio(){if(!AC)return;const n=AC.currentTime,on=playing&&started&&T<TOTAL?1:0;
  dG.gain.setTargetAtTime((au.dr||0)*on,n,.3);dF.frequency.setTargetAtTime(au.cut,n,.3);nG.gain.setTargetAtTime((au.nz||0)*on,n,.3);nF.frequency.setTargetAtTime(au.nf,n,.3);padG.gain.setTargetAtTime((au.pad||0)*on,n,.5);
  if(!on)return;while(evi<EV.length&&EV[evi][0]<=T){if(T-EV[evi][0]<.3)EV[evi][1]();evi++}
  if(au.bpm){if(T>=nextBeat){thump(.5);setTimeout(()=>AC&&playing&&thump(.3),170);nextBeat=Math.max(nextBeat,T)+60/au.bpm}}else nextBeat=T}

// ---------- film grain, vignette, loop ----------
const gr=document.createElement('canvas');gr.width=gr.height=256;{const g=gr.getContext('2d'),im=g.createImageData(256,256);for(let i=0;i<im.data.length;i+=4){im.data[i]=im.data[i+1]=im.data[i+2]=Math.random()*255;im.data[i+3]=255}g.putImageData(im,0,0)}
function post(){screen();x.globalAlpha=1;if(flash>0){x.fillStyle=`rgba(255,244,220,${flash})`;x.fillRect(0,0,W,H)}
  const v=x.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');x.fillStyle=v;x.fillRect(0,0,W,H);
  const n=Math.floor(performance.now()/80),ox=hash(n)*256|0,oy=hash(n+5)*256|0;x.globalAlpha=.07;x.globalCompositeOperation='overlay';for(let i=-1;i<W/256;i++)for(let j=-1;j<H/256;j++)x.drawImage(gr,i*256+ox,j*256+oy);
  x.globalCompositeOperation='source-over';x.globalAlpha=1;if(fadeK>0){x.fillStyle=`rgba(0,0,0,${fadeK})`;x.fillRect(0,0,W,H)}}
function title(){screen();x.fillStyle='#000';x.fillRect(0,0,W,H);spark(W/2,H/2,7*(1+.12*sin(performance.now()/500)));x.strokeStyle='rgba(255,236,200,.4)';x.lineWidth=2;x.beginPath();x.arc(W/2,H/2,58,0,TAU);x.stroke();
  x.fillStyle='rgba(255,236,200,.5)';x.beginPath();x.moveTo(W/2-6,H/2+80);x.lineTo(W/2+9,H/2+89);x.lineTo(W/2-6,H/2+98);x.fill()}
let playing=false,started=false,last=0;
{const q=new URLSearchParams(location.search);if(q.get('t')!=null){started=true;playing=!q.get('p');T=+q.get('t');seekEv()}}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(playing&&started&&T<TOTAL)T+=dt;
  screen();x.globalAlpha=1;x.globalCompositeOperation='source-over';au={dr:.04,cut:220,nz:.03,nf:320,pad:0,bpm:0};fadeK=0;flash=0;
  if(!started||T>=TOTAL)title();
  else{let i=0,u=T;while(i<SH.length-1&&u>=SH[i][0]){u-=SH[i][0];i++}SH[i][1](u,cl(u/SH[i][0]));post();
    if(!playing){screen();x.fillStyle='rgba(255,255,255,.55)';x.fillRect(W-58,30,9,30);x.fillRect(W-41,30,9,30)}}
  audio();requestAnimationFrame(frame)}
function go(){if(!AC)initAudio();if(!started||T>=TOTAL){started=true;T=0;playing=true;seekEv();AC&&AC.resume()}else{playing=!playing;AC&&(playing?AC.resume():AC.suspend())}}
cv.onclick=go;
onkeydown=e=>{if(e.code=='Space'){e.preventDefault();go()}else if(e.code=='ArrowRight'||e.code=='ArrowLeft'){T=cl(T+(e.code=='ArrowRight'?5:-5),0,TOTAL-.01);seekEv()}};
requestAnimationFrame(frame);
</script>
