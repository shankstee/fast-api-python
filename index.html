<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strings</title>
<style>
  html,body{margin:0;height:100%;background:#0c0b0a;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{width:min(100vw,177.78vh);aspect-ratio:16/9;display:block;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// STRINGS — a wordless short film in red thread, black ink and gold leaf. Picture and sound are generated here.
const cv=document.getElementById('c'),x=cv.getContext('2d'),W=1280,H=720,D=Math.min(2,window.devicePixelRatio||1);
cv.width=W*D;cv.height=H*D;
const PI=Math.PI,TAU=PI*2,sin=Math.sin,cos=Math.cos;
const cl=(v,a=0,b=1)=>v<a?a:v>b?b:v,lerp=(a,b,k)=>a+(b-a)*k,sm=p=>{p=cl(p);return p*p*(3-2*p)};
const seg=(v,a,b)=>cl((v-a)/(b-a)),ss=(v,a,b)=>sm(seg(v,a,b)),pulse=(v,a,b,f=.4)=>Math.min(ss(v,a,a+f),1-ss(v,b-f,b));
const hash=n=>{const v=sin(n*127.1+3.7)*43758.5453;return v-Math.floor(v)};
const mixA=(a,b,k)=>a.map((v,i)=>lerp(v,b[i],cl(k))),rgb=a=>`rgb(${a.map(v=>v|0)})`,rgba=(a,al)=>`rgba(${a.map(v=>v|0)},${al})`;
const PAPER='#ece2cc',PAP=[236,226,204],INK='#15130f',RED=[200,38,28],GOLD='#d9a520';
let cam={x:0,y:0,z:1},T=0,au={},fadeK=0,fadeC=[0,0,0],flash=0,DK=0;

// ---------- paper ----------
const paper=document.createElement('canvas');paper.width=W;paper.height=H;{const g=paper.getContext('2d');g.fillStyle=PAPER;g.fillRect(0,0,W,H);let r=7;const R=()=>(r=r*16807%2147483647)/2147483647;
  for(let i=0;i<46;i++){const px=R()*W,py=R()*H,rr=120+R()*320,gd=g.createRadialGradient(px,py,0,px,py,rr),c=R()<.5?'120,92,50':'255,252,240';gd.addColorStop(0,`rgba(${c},.07)`);gd.addColorStop(1,`rgba(${c},0)`);g.fillStyle=gd;g.fillRect(0,0,W,H)}
  for(let i=0;i<2600;i++){const px=R()*W,py=R()*H,a=R()*TAU,l=3+R()*16;g.strokeStyle=R()<.5?`rgba(96,74,44,${.04+R()*.07})`:`rgba(255,253,244,${.06+R()*.1})`;g.lineWidth=.7;g.beginPath();g.moveTo(px,py);g.lineTo(px+cos(a)*l,py+sin(a)*l);g.stroke()}}
function world(){x.setTransform(D*cam.z,0,0,D*cam.z,D*(W/2-cam.x*cam.z),D*(H/2-cam.y*cam.z))}
function screen(){x.setTransform(D,0,0,D,0,0)}
// k = how much ink has soaked the page (0 paper .. 1 night), gd = gold wash
function bg(k=0,gd=0){screen();x.drawImage(paper,0,0,W,H);DK=k;x.globalCompositeOperation='multiply';
  if(gd>0){x.fillStyle=rgb(mixA([255,255,255],[255,216,140],gd));x.fillRect(0,0,W,H)}
  if(k>0){x.fillStyle=rgb(mixA([255,255,255],[14,16,36],k));x.fillRect(0,0,W,H)}
  x.globalCompositeOperation='source-over';world()}
function glow(gx,gy,r,a,c=[255,90,50]){if(a<=0||r<=0)return;const g=x.createRadialGradient(gx,gy,0,gx,gy,r);g.addColorStop(0,rgba(c,Math.min(1,a)));g.addColorStop(1,rgba(c,0));
  x.globalCompositeOperation='lighter';x.fillStyle=g;x.beginPath();x.arc(gx,gy,r,0,TAU);x.fill();x.globalCompositeOperation='source-over'}
const INKc=()=>DK>.45?'rgba(236,226,204,.6)':INK;
const tcol=(e=1)=>rgb(mixA(mixA([158,84,74],RED,e*1.6),[255,104,64],DK*.7*cl(e*3+.3)));
const LW=()=>1.7/Math.max(1,cam.z/2.6);
function thr(e=1,w=1){x.strokeStyle=tcol(e);x.lineWidth=LW()*w;x.lineCap=x.lineJoin='round'}

// ---------- drawing kit ----------
// a wound ball of thread
function scrib(cx,cy,rx,ry,L,ph){x.beginPath();for(let u=0;u<=L;u+=.24)x.lineTo(cx+rx*sin(u+ph)*(.6+.4*sin(u*.231+ph*.7)),cy+ry*cos(u*1.27+ph*1.3)*(.6+.4*cos(u*.193)));x.stroke()}
function rope(a,b,sag=0,vib=0){const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1,v=vib*sin(T*75);x.beginPath();x.moveTo(a[0],a[1]);
  x.quadraticCurveTo((a[0]+b[0])/2+sag*(1+.25*sin(T*1.1+a[0]*.1))-dy/l*v,(a[1]+b[1])/2+Math.abs(sag)*.5+dx/l*v,b[0],b[1]);x.stroke()}
function pdot(a,b,ph){const k=ph-Math.floor(ph),px=lerp(a[0],b[0],k),py=lerp(a[1],b[1],k);glow(px,py,16,.8,[255,140,80]);x.fillStyle='#ffd9b0';x.beginPath();x.arc(px,py,2.2,0,TAU);x.fill()}
function star(sx,sy,r,rot=0,a=1){if(a<=0||r<=0)return;x.save();x.globalAlpha=a;x.translate(sx,sy);x.rotate(rot);x.beginPath();for(let i=0;i<10;i++){const an=i*PI/5-PI/2,q=i%2?r*.46:r;x.lineTo(cos(an)*q,sin(an)*q)}
  x.closePath();x.fillStyle=GOLD;x.fill();x.strokeStyle=INK;x.lineWidth=Math.max(.6,r*.09);x.stroke();x.restore()}
function ground(k=1){if(k<=0)return;x.strokeStyle=INKc();x.lineCap='round';x.lineWidth=2.6;x.beginPath();for(let i=0;i<=80*k;i++){const px=lerp(-1200,1200,i/80);x.lineTo(px,sin(px*.045)*1.1+sin(px*.011)*2)}x.stroke()}
function city(g,lit,a=1){if(a<=0||g<=0)return;if(DK>.4)glow(460,-400,560,.12*lit*a);for(let i=0;i<7;i++){const bx=190+i*78,bh=(300+700*hash(i+2))*g;x.globalAlpha=a*.6;x.strokeStyle=INKc();x.lineWidth=2.4;x.strokeRect(bx,-bh,54,bh);
    if(i==3){x.fillStyle=GOLD;x.beginPath();[[0,0],[-3,-22],[11,-9],[27,-26],[43,-9],[57,-22],[54,0]].forEach(q=>x.lineTo(bx+q[0],-bh+q[1]));x.fill()}
    x.globalAlpha=a;x.fillStyle=tcol(1);const rows=bh/22|0;for(let r=1;r<rows;r++)for(let q=0;q<3;q++)if(hash(i*9.1+r*3.3+q)<lit*.85)x.fillRect(bx+9+q*14,-r*22,8,3.5)}x.globalAlpha=1}
function ladder(lx,h){if(h<=2)return;thr();const wb=i=>sin(i*1.7)*1.2;for(const k of[-11,11]){x.beginPath();x.moveTo(lx+k,0);for(let y=0;y<=h;y+=20)x.lineTo(lx+k+wb(y+k),-y);x.lineTo(lx+k,-h);x.stroke()}
  x.beginPath();for(let y=14;y<h;y+=16){x.moveTo(lx-11,-y);x.lineTo(lx+11,-y+wb(y))}x.stroke()}
function tree(tx,ty,g){if(g<=0)return;const br=(x1,y1,a,len,d)=>{const gg=cl(g*7.5-d*.95);if(gg<=0||d>6)return;const l=len*sm(gg),a2=a+sin(T*1.2+d)*.012*d,x2=x1+cos(a2)*l,y2=y1+sin(a2)*l;
    thr(1,Math.max(.8,(6.4-d)*.38));x.beginPath();x.moveTo(x1,y1);x.quadraticCurveTo((x1+x2)/2+sin(d*2.1+a)*5,(y1+y2)/2,x2,y2);x.stroke();const r=hash(d*13.7+a*5.1);
    br(x2,y2,a-.34-.28*r,len*.76,d+1);br(x2,y2,a+.3+.3*hash(r*9.1),len*.73,d+1);if(d>=3)star(x2,y2,(3+3*hash(a*3.3))*sm(gg),a*3)};br(tx,ty,-PI/2,70,0)}

// the one made of thread. e = how much of them is left. p.y = feet.
function hero(p){const s=p.s||1,dir=p.dir||1,e=cl(p.e??1,0,1.4),c=p.c||0,lean=p.lean||0,w=p.w||0,wa=p.wa||0,py=p.y+(p.hop||0),hd=p.hd||[0,0],ph=p.still?1.3:T*.45,A=p.a??1;
  const hipY=-19+11*c,bY=hipY-18,hdX=hd[0],hdY=bY-29+hd[1],cs=cos(lean),sn=sin(lean),sh=bY-11,al=p.al||[-7,24],ar=p.ar||[7,24];
  const toW=(lx,ly)=>{const yy=ly-hipY;return[p.x+dir*s*(lx*cs-yy*sn),py+s*(lx*sn+yy*cs+hipY)]};
  if(DK>0&&e>0){const q=toW(0,bY);glow(q[0],q[1],s*(30+60*e),.4*DK*cl(e*4+.25)*A)}
  x.save();x.translate(p.x,py);x.scale(dir*s,s*(p.sy||1));x.globalAlpha=A;thr(e);
  for(const k of[-1,1]){const q=w+(k<0?PI:0),fx=p.limp?k*4+sin(T*1.4+k)*1.5:k*6+sin(q)*8*wa,fy=p.limp?5:-Math.max(0,cos(q))*5*wa;
    x.beginPath();x.moveTo(k*4,hipY);x.quadraticCurveTo(k*5+(p.limp?0:4),(hipY+fy)/2,fx,fy);x.stroke();x.beginPath();x.ellipse(fx+2.5,fy-1,4.5,2,0,0,TAU);x.stroke()}
  x.translate(0,hipY);x.rotate(lean);x.translate(0,-hipY);
  for(const k of[-1,1]){const h=k<0?al:ar,sx=k*8,hx=sx+h[0],hy=sh+h[1];x.beginPath();x.moveTo(sx,sh);x.quadraticCurveTo((sx+hx)/2+k*4,(sh+hy)/2+4,hx,hy);x.stroke();x.beginPath();x.arc(hx,hy,2.6,0,TAU);x.stroke()}
  x.globalAlpha=A*.4;x.beginPath();x.ellipse(0,bY,13,18,0,0,TAU);x.stroke();x.beginPath();x.arc(hdX,hdY,11.5,0,TAU);x.stroke();x.globalAlpha=A;
  scrib(0,bY,13,18,4+58*e,ph);scrib(hdX,hdY,11.5,11.5,5+26*e,ph*1.3+2);
  [[4,bY+3],[-5,bY-6],[6,bY-9],[-3,bY+10]].slice(0,p.stars||0).forEach((q,i)=>star(q[0],q[1],4.2,i*.7,A));
  const lk=p.look||[.3,0],op=p.open??1,joy=p.joy||0,br=p.brow||0,ec=DK>.45?PAPER:INK;
  if(e>0||A>=1)for(const k of[-1,1]){const ex=hdX+1.5+k*4.6+lk[0]*1.5,ey=hdY-1+lk[1]*1.5;
    if(joy>.6||op<.12){x.strokeStyle=ec;x.lineWidth=1.7;x.beginPath();if(joy>.6)x.arc(ex,ey+1.6,3.1,PI*1.12,PI*1.88);else{x.moveTo(ex-3,ey+1);x.lineTo(ex+3,ey+1)}x.stroke()}
    else{x.fillStyle=PAPER;x.strokeStyle=ec;x.lineWidth=.8;x.beginPath();x.ellipse(ex,ey,3.8,3.8*op,0,0,TAU);x.fill();x.stroke();const qx=ex+lk[0]*1.4,qy=ey+lk[1]*1.4*op;
      x.fillStyle=INK;x.beginPath();x.arc(qx,qy,1.8*Math.min(1,op+.25),0,TAU);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(qx-.7,qy-.7,.55,0,TAU);x.fill()}
    if(br){x.strokeStyle=ec;x.lineWidth=1.5;x.beginPath();x.moveTo(ex-k*3.8,ey-5+1.7*br);x.lineTo(ex+k*3.8,ey-5-1.7*br);x.stroke()}}
  x.restore();
  return{hl:toW(-8+al[0],sh+al[1]),hr:toW(8+ar[0],sh+ar[1]),top:toW(hdX,hdY-11.5),chest:toW(0,bY),back:toW(-6,bY-6)}}

// the hands. ink silhouettes with a chalk edge. one wears a cuff and a gold cufflink, one wears a ring.
const FB=[-63,-21,21,63],FL=[150,170,160,125],PT=[0,1,1,1],FIST=[1,1,1,1],OPEN=[0,0,0,0],TUCK=[-.9,.3],BO=[30,-100,100,-20];
const hgeo=h=>{const po=h.pose||OPEN,sp=h.spread??.5;return FB.map((bx,i)=>{const a=(i-1.5)*sp*.13,l=FL[i]*(1-.74*po[i]);return[bx,150,bx+sin(a)*l,150+cos(a)*l]})};
const hpt=(h,lx,ly)=>{const s=h.s||1,sd=h.side||1,r=h.rot||0;return[h.x+s*(lx*sd*cos(r)-ly*sin(r)),h.y+s*(lx*sd*sin(r)+ly*cos(r))]};
const ftip=(h,i=0)=>{const f=hgeo(h)[i];return[f[2],f[3]]};
const thumbTip=h=>{const t=h.thumb||[.7,0],l=105*(1-.6*t[1]);return[-85-sin(t[0])*l,75+cos(t[0])*l]};
function handTo(h,P,lp){h.x=0;h.y=0;const q=hpt(h,lp[0],lp[1]);h.x=P[0]-q[0];h.y=P[1]-q[1];return h}
const barPt=(h,o)=>hpt(h,o*cos(h.bar||0),158+o*sin(h.bar||0));
function hand(h){const s=h.s||1,sd=h.side||1,fg=hgeo(h),tt=thumbTip(h),bo=(hash(Math.floor(T*6))-.5)*.01,aw=h.cuff?82:58;
  x.save();x.translate(h.x,h.y);x.rotate((h.rot||0)+bo);x.scale(s*sd,s);x.globalAlpha=h.a??1;x.lineCap=x.lineJoin='round';
  const pass=(g,col)=>{x.strokeStyle=x.fillStyle=col;x.lineWidth=g;x.beginPath();x.rect(-aw,-1700,aw*2,1705);x.fill();if(g)x.stroke();x.beginPath();x.roundRect(-85,-6,170,170,44);x.fill();if(g)x.stroke();
    if(!g&&h.bar!=null){x.save();x.translate(0,158);x.rotate(h.bar);for(const[c2,w2]of[[PAPER,17],['#5a4630',13]]){x.strokeStyle=c2;x.lineWidth=w2;x.beginPath();x.moveTo(-116,0);x.lineTo(116,0);x.stroke()}x.restore();x.strokeStyle=col}
    x.lineWidth=42+g;x.beginPath();x.moveTo(-70,80);x.lineTo(tt[0],tt[1]);x.stroke();x.lineWidth=38+g;for(const f of fg){x.beginPath();x.moveTo(f[0],f[1]-10);x.lineTo(f[2],f[3]);x.stroke()}};
  pass(7,PAPER);pass(0,INK);
  if(h.cuff){x.fillStyle=PAPER;x.strokeStyle=INK;x.lineWidth=5;x.beginPath();x.roundRect(-76,-84,152,66,8);x.fill();x.stroke();x.fillStyle=GOLD;x.lineWidth=2.5;x.beginPath();x.arc(48,-51,9,0,TAU);x.fill();x.stroke()}
  if(h.ring){const f=fg[2],dx=f[2]-f[0],dy=f[3]-f[1],l=Math.hypot(dx,dy)||1,cx=f[0]+dx*.28,cy=f[1]+dy*.28;x.strokeStyle=GOLD;x.lineWidth=11;x.lineCap='butt';x.beginPath();x.moveTo(cx-dy/l*19,cy+dx/l*19);x.lineTo(cx+dy/l*19,cy-dx/l*19);x.stroke()}
  if(h.wind){const f=fg[0];x.strokeStyle=tcol(1);x.lineWidth=2.4;x.lineCap='round';for(let j=0;j<h.wind;j++){const q=.14+.062*j,cx=f[0]+(f[2]-f[0])*q,cy=f[1]-10+(f[3]-f[1]+10)*q;x.beginPath();x.moveTo(cx-20,cy-3);x.lineTo(cx+20,cy+3);x.stroke()}}
  x.restore()}
// marionette strings from the bar to back, hands, head. ks = how far each has been drawn (0..1)
function strings(h,g,ks,sag=0,vib=0){thr(1,.8);[g.back,g.hl,g.hr,g.top].forEach((a,i)=>{const k=ks[i];if(k<=0)return;const b=barPt(h,BO[i]);rope(a,[lerp(a[0],b[0],k),lerp(a[1],b[1],k)],sag*(i%2?1:-1),vib)})}
const shk=(u,ts,amp)=>{let s=0;for(const t0 of ts){const d=u-t0;if(d>0&&d<1)s=Math.max(s,1-d)}const n=Math.floor(T*45);return[(hash(n)-.5)*amp*s,(hash(n+9)-.5)*amp*s]};

// ---------- the film: shots [seconds, draw(u = seconds in, p = 0..1)] ----------
const SH=[],LX=46,HX=-70,RY=i=>860*i/6,SX=150,SY=-430;
const SP=[...Array(11)].map((_,i)=>{const a=PI/2+i*PI/5,r=i%2?70:30;return[SX+cos(a)*r,SY+sin(a)*r]});
const PB=()=>({x:HX,y:-900,side:1,cuff:1,s:.8,pose:FIST,thumb:TUCK,bar:0});
const limpP=o=>({x:HX,y:-78,e:.04,still:1,limp:1,open:0,hd:[5,7],al:[-12,-14],ar:[12,-14],...o});
function bigStar(dr,fl,bob=0){x.save();x.translate(0,bob);if(fl>0){x.globalAlpha=fl;x.fillStyle=GOLD;x.beginPath();SP.forEach(q=>x.lineTo(q[0],q[1]));x.fill();
    x.strokeStyle='rgba(217,165,32,.55)';x.lineWidth=2;x.beginPath();for(let i=0;i<14;i++){const a=i*TAU/14+T*.15,r1=92+6*sin(T*2+i),r2=r1+(i%2?26:44)*fl;x.moveTo(SX+cos(a)*r1,SY+sin(a)*r1);x.lineTo(SX+cos(a)*r2,SY+sin(a)*r2)}x.stroke();x.globalAlpha=1}
  thr(1,1.3);x.beginPath();const m=dr*10,n=Math.floor(m);for(let i=0;i<=n;i++)x.lineTo(SP[i][0],SP[i][1]);if(n<10)x.lineTo(lerp(SP[n][0],SP[n+1][0],m-n),lerp(SP[n][1],SP[n+1][1],m-n));x.stroke();x.restore()}

// 1. a line draws itself, and winds into someone
SH.push([8,u=>{cam={x:0,y:-48,z:2.5};bg(0);const k=ss(u,.3,3),born=ss(u,2.4,4.2),hp=pulse(u,5.6,7.4,.3);
  thr();x.beginPath();for(let i=0;i<=140*k;i++){const q=i/140,r=150*Math.pow(1-q,1.4)*(1-born);x.lineTo(cos(q*13+1)*r*1.5,-38+sin(q*13+1)*r*.8)}x.stroke();ground(ss(u,3.6,5.2));
  hero({x:0,y:0,e:born,a:born,open:ss(u,4.2,4.5),look:[sin(u*2.2)*.9*ss(u,4.5,5)*(1-hp),-.2],hop:-Math.abs(sin((u-5.6)*5.2))*14*hp,joy:hp,ar:[7+10*hp,24-44*hp],al:[-7-10*hp,24-44*hp]});
  fadeK=1-ss(u,0,.8);fadeC=PAP;au.pad=.2*born}]);
// 2. a hand from above. a pat on the head. a gold star.
SH.push([9,u=>{cam={x:20,y:-195,z:1.4};const dn=ss(u,1.2,3),pat=u>3&&u<4.1?Math.abs(sin((u-3)*PI/.55)):0,pin=ss(u,4.1,4.5)*(1-ss(u,5.5,5.9)),st=ss(u,4.7,5.4),up=ss(u,5.9,8.8),hp=pulse(u,5.5,7.3,.3),got=u>5.4;
  bg(.1*pulse(u,1,8,1));ground();
  hero({x:0,y:0,c:.3*pat,look:[.15,-.9+1.6*st*(1-ss(u,5.6,6.2))],joy:got?hp:0,hop:-Math.abs(sin((u-5.5)*5.2))*12*hp,stars:got?1:0,ar:[7+5*up,24-56*up],brow:-.7*ss(u,7.8,8.8)});
  const tip=[lerp(lerp(2,6,st),90,up),lerp(lerp(lerp(lerp(-660,-80,dn)+7*pat,-120,ss(u,4.1,4.6)),-40,st),-760,up)],h={side:1,cuff:1,s:.8,pose:[.55*pin,1,1,1],spread:.2,thumb:[lerp(-.9,-.1,pin),lerp(.3,-.4,pin)]};
  handTo(h,tip,ftip(h));hand(h);if(u>4.25&&!got)star(tip[0]-8,tip[1]+4,5,.2);
  if(got&&u<6.3){const d=u-5.4;x.globalAlpha=1-d/.9;x.strokeStyle=GOLD;x.lineWidth=1.6;x.beginPath();for(let i=0;i<8;i++){const a=i*PI/4+.3;x.moveTo(3+cos(a)*(10+d*30),-37+sin(a)*(10+d*30));x.lineTo(3+cos(a)*(16+d*44),-37+sin(a)*(16+d*44))}x.stroke();x.globalAlpha=1}
  au.pad=.3*hp}]);
// 3. so they give a little of themselves, tied in a bow
SH.push([7,u=>{cam={x:14,y:-80,z:2.3};bg(0);ground();const a=ss(u,1.8,2.4),b=ss(u,2.5,3.6),hd=ss(u,3.9,5),up=ss(u,5.3,7),low=ss(u,5.4,6),wv=pulse(u,5.6,7,.4)*(.7+.3*sin(u*10));
  const g=hero({x:0,y:0,e:1-.1*b,stars:1,look:[.2,lerp(.9,-.9,ss(u,.9,1.6))],joy:.5*b,ar:[lerp(lerp(lerp(7,-6,a),16,b),7,low),lerp(lerp(lerp(24,14,a),-34,b),24,low)],al:[-7-8*wv,24-46*wv]});
  const tip=[26,lerp(lerp(-430,-86,hd),-430,up)],h={side:1,cuff:1,s:.8,pose:[.55,1,1,1],spread:.2,thumb:[-.1,-.4]};handTo(h,tip,ftip(h));

const gr=document.createElement('canvas');gr.width=gr.height=256;{const g=gr.getContext('2d'),im=g.createImageData(256,256);for(let i=0;i<im.data.length;i+=4){im.data[i]=im.data[i+1]=im.data[i+2]=Math.random()*255;im.data[i+3]=255}g.putImageData(im,0,0)}
function post(){screen();x.globalAlpha=1;if(flash>0){x.fillStyle=`rgba(255,244,226,${flash})`;x.fillRect(0,0,W,H)}
  const v=x.createRadialGradient(W/2,H/2,H*.38,W/2,H/2,H*.98);v.addColorStop(0,'rgba(30,20,10,0)');v.addColorStop(1,'rgba(30,20,10,.38)');x.fillStyle=v;x.fillRect(0,0,W,H);
  const n=Math.floor(performance.now()/80),ox=hash(n)*256|0,oy=hash(n+5)*256|0;x.globalAlpha=.06;x.globalCompositeOperation='overlay';for(let i=-1;i<W/256;i++)for(let j=-1;j<H/256;j++)x.drawImage(gr,i*256+ox,j*256+oy);
  x.globalCompositeOperation='source-over';x.globalAlpha=1;if(fadeK>0){x.fillStyle=rgba(fadeC,fadeK);x.fillRect(0,0,W,H)}}
function title(){screen();x.drawImage(paper,0,0,W,H);DK=0;const cx=W/2,cy=H/2-10;x.strokeStyle=rgb(RED);x.lineWidth=1.8;x.lineCap='round';scrib(cx,cy,34,34,30,performance.now()/2600);
  x.fillStyle=INK;x.beginPath();x.moveTo(cx-7,cy+62);x.lineTo(cx+10,cy+72);x.lineTo(cx-7,cy+82);x.fill();post()}
let playing=false,started=false,last=0;
{const q=new URLSearchParams(location.search);if(q.get('t')!=null){started=true;playing=!q.get('p');T=+q.get('t');seekEv()}}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(playing&&started&&T<TOTAL)T+=dt;
  screen();x.globalAlpha=1;x.globalCompositeOperation='source-over';au={dr:.03,cut:220,nz:.012,nf:320,pad:0,bpm:0};fadeK=0;fadeC=[0,0,0];flash=0;DK=0;
  if(!started||T>=TOTAL)title();
  else{let i=0,u=T;while(i<SH.length-1&&u>=SH[i][0]){u-=SH[i][0];i++}SH[i][1](u,cl(u/SH[i][0]));post();
    if(!playing){screen();x.fillStyle='rgba(120,110,95,.7)';x.fillRect(W-58,30,9,30);x.fillRect(W-41,30,9,30)}}
  audio();requestAnimationFrame(frame)}
function go(){if(!AC)initAudio();if(!started||T>=TOTAL){started=true;T=0;playing=true;seekEv();AC&&AC.resume()}else{playing=!playing;AC&&(playing?AC.resume():AC.suspend())}}
cv.onclick=go;
onkeydown=e=>{if(e.code=='Space'){e.preventDefault();go()}else if(e.code=='ArrowRight'||e.code=='ArrowLeft'){T=cl(T+(e.code=='ArrowRight'?5:-5),0,TOTAL-.01);seekEv()}};
requestAnimationFrame(frame);
